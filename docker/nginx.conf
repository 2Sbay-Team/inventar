server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;

    # SPA fallback for app routes only — asset paths (handled below) return
    # real 404s when the file is missing, so broken-link crawlers and
    # service-worker precaches see the truth instead of a fallback HTML.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # v0.6.7 — origin sends the strongest "do not cache" header set we
    # can: 12 May 2026 field investigation showed Cloudflare's Browser
    # Cache TTL rewriting our previous `no-cache` to `max-age=14400`
    # on /sw.js, which froze merchants on stale builds for hours.
    # The dashboard-side fix (a Cache Rule that bypasses cache for
    # /sw.js + /whats-new.json) is documented in DEPLOY.md and is the
    # load-bearing change; the headers below are belt-and-suspenders so
    # origin-direct traffic, alternate CDN paths, and CF plans that
    # honour origin Cache-Control all get the right answer.
    #
    # `always` re-applies the header on 304 / error responses (earlier
    # plain `add_header` skipped those, which is how some downstreams
    # saw "no header → use my own default TTL"). Pragma + Expires are
    # HTTP/1.0 / legacy-cache belts in case anything in the path strips
    # Cache-Control. /whats-new.json carries the consent-modal version
    # metadata; it MUST refetch every load alongside the SW itself.

    location = /index.html {
        add_header Cache-Control "no-store, no-cache, must-revalidate, max-age=0" always;
        add_header Pragma "no-cache" always;
        add_header Expires "0" always;
    }
    location = /sw.js {
        add_header Cache-Control "no-store, no-cache, must-revalidate, max-age=0" always;
        add_header Pragma "no-cache" always;
        add_header Expires "0" always;
        # Service-Worker-Allowed advertises the SW scope; some CDNs key
        # cache decisions off the presence of this header and avoid the
        # default static-asset TTL they'd otherwise apply to *.js.
        add_header Service-Worker-Allowed "/" always;
    }
    location = /whats-new.json {
        default_type application/json;
        add_header Cache-Control "no-store, no-cache, must-revalidate, max-age=0" always;
        add_header Pragma "no-cache" always;
        add_header Expires "0" always;
    }
    location = /manifest.webmanifest {
        default_type application/manifest+json;
        add_header Cache-Control "no-store, no-cache, must-revalidate, max-age=0" always;
        add_header Pragma "no-cache" always;
        add_header Expires "0" always;
    }
    location = /robots.txt {
        default_type text/plain;
    }

    # Aggressively cache hashed assets — Vite emits /assets/[name].[hash].[ext]
    # try_files ... =404 prevents the SPA fallback from masking missing assets.
    location /assets/ {
        try_files $uri =404;
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # Icons + self-hosted fonts: long-lived, real 404 if missing
    location /icons/ {
        try_files $uri =404;
        expires 1y;
        add_header Cache-Control "public, immutable";
    }
    location /fonts/ {
        try_files $uri =404;
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # CSP — strict, no inline scripts allowed. Fonts now self-hosted, so
    # google-domain whitelisting removed (default-src 'self' covers them).
    add_header Content-Security-Policy "
        default-src 'self';
        img-src 'self' data: blob:;
        script-src 'self';
        style-src 'self' 'unsafe-inline';
        font-src 'self';
        connect-src 'self';
        manifest-src 'self';
        worker-src 'self';
        frame-ancestors 'none';
        base-uri 'self';
        form-action 'self';
    " always;

    # Hardening headers. Cloudflare may add some of these at the edge, but
    # serving them at origin is belt-and-suspenders and works if/when the
    # tunnel is bypassed (direct port-forward, local docker test, etc.).
    add_header X-Frame-Options "DENY" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header Permissions-Policy "camera=(self), microphone=(), geolocation=(), interest-cohort=()" always;
    add_header Cross-Origin-Opener-Policy "same-origin" always;
    add_header Cross-Origin-Resource-Policy "same-origin" always;

    # Health check
    location = /health {
        return 200 "ok";
        access_log off;
        add_header Content-Type text/plain;
    }
}
