server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;

    # SPA fallback for app routes only — asset paths (handled below) return
    # real 404s when the file is missing, so broken-link crawlers and
    # service-worker precaches see the truth instead of a fallback HTML.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # index.html and the service worker must revalidate on every navigation
    # so users get new builds, but we drop "no-store" so browsers can keep the
    # response in the back/forward cache (Lighthouse bfcache audit). "no-cache"
    # alone forces a conditional GET on each load — still safe for updates.
    location = /index.html {
        add_header Cache-Control "no-cache";
    }
    location = /sw.js {
        add_header Cache-Control "no-cache";
    }
    location = /manifest.webmanifest {
        default_type application/manifest+json;
        add_header Cache-Control "no-cache";
    }
    location = /robots.txt {
        default_type text/plain;
    }

    # Aggressively cache hashed assets — Vite emits /assets/[name].[hash].[ext]
    # try_files ... =404 prevents the SPA fallback from masking missing assets.
    location /assets/ {
        try_files $uri =404;
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # Icons + self-hosted fonts: long-lived, real 404 if missing
    location /icons/ {
        try_files $uri =404;
        expires 1y;
        add_header Cache-Control "public, immutable";
    }
    location /fonts/ {
        try_files $uri =404;
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # CSP — strict, no inline scripts allowed. Fonts now self-hosted, so
    # google-domain whitelisting removed (default-src 'self' covers them).
    add_header Content-Security-Policy "
        default-src 'self';
        img-src 'self' data: blob:;
        script-src 'self';
        style-src 'self' 'unsafe-inline';
        font-src 'self';
        connect-src 'self';
        manifest-src 'self';
        worker-src 'self';
    " always;

    # Health check
    location = /health {
        return 200 "ok";
        access_log off;
        add_header Content-Type text/plain;
    }
}
