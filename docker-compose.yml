services:
  inventar_web:
    build:
      context: .
      dockerfile: docker/web.Dockerfile
    container_name: inventar_web
    networks:
      - edge
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1/health"]
      interval: 30s
      timeout: 5s
      retries: 3

networks:
  edge:
    external: true
